services:
  - type: web
    name: btc-intelligence-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALERTS_ENABLED
        value: 'false'
      - key: MARKET_PROVIDER
        value: kraken
      - key: DB_PATH
        value: /tmp/btc-intelligence-signals.db
