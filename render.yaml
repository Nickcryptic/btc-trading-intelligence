databases:
  - name: btc-signal-journal
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: btc_signal_journal
    user: btc_signal_journal_user

services:
  - type: web
    name: btc-intelligence-dashboard
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: ALERTS_ENABLED
        value: 'false'
      - key: MARKET_PROVIDER
        value: kraken
      - key: DB_PATH
        value: /tmp/btc-intelligence-signals.db
      - key: DATABASE_URL
        fromDatabase:
          name: btc-signal-journal
          property: connectionString
